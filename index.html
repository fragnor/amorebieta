<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Turno e Incidencias</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-12">

  <div class="max-w-5xl mx-auto px-4 pt-6">
    <header class="bg-slate-800 border-b border-slate-700 p-6 rounded-t-xl shadow-lg">
      <h1 class="text-2xl font-bold tracking-tight text-cyan-400 mb-4">⚙️ SISTEMA CENTRAL DE REPORTE OPERATIVO</h1>
      
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Fecha de Trabajo</label>
          <input type="date" id="comun_fecha" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-cyan-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Turno</label>
          <select id="comun_turno" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-cyan-500">
            <option value="Mañana">Mañana</option>
            <option value="Tarde">Tarde</option>
            <option value="Noche">Noche</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Operario Responsable</label>
          <input type="text" id="comun_operario" placeholder="Nombre de operario" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-cyan-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Número de Lote</label>
          <input type="text" id="comun_lote" placeholder="ID de Lote" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-cyan-500">
        </div>
      </div>
    </header>

    <nav class="flex bg-slate-800/80 border-b border-slate-700 px-2 overflow-x-auto">
      <button onclick="switchTab('tab_produccion')" id="btn_tab_produccion" class="py-3 px-4 font-medium border-b-2 border-cyan-500 text-cyan-400 whitespace-nowrap cursor-pointer">Parte de Trabajo</button>
      <button onclick="switchTab('tab_incidencias')" id="btn_tab_incidencias" class="py-3 px-4 font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 whitespace-nowrap cursor-pointer">Incidencias</button>
      <button onclick="switchTab('tab_recambios')" id="btn_tab_recambios" class="py-3 px-4 font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 whitespace-nowrap cursor-pointer">Recambios</button>
      <button onclick="switchTab('tab_explosiones')" id="btn_tab_explosiones" class="py-3 px-4 font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 whitespace-nowrap cursor-pointer">Explosiones</button>
    </nav>

    <div class="bg-slate-800 p-6 rounded-b-xl shadow-xl border-x border-b border-slate-700">
      
      <section id="tab_produccion" class="tab-content active space-y-6">
        <h2 class="text-xl font-semibold text-slate-200 border-l-4 border-cyan-500 pl-2">Parte Final de Trabajo / Producción</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Hora Fin de Molino</label>
            <input type="time" id="prod_h_mol_fin" class="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-white focus:border-cyan-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Hora Fin de Producción</label>
            <input type="time" id="prod_h_prod_fin" class="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-white focus:border-cyan-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Número de Pulpadas</label>
            <input type="number" id="prod_n_pulpadas" placeholder="0" class="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-white focus:border-cyan-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Seleccionar Operador SERAM (Col. M)</label>
            <select id="prod_op_seram" class="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-white focus:border-cyan-500">
              <option value="">Cargando operadores...</option>
            </select>
          </div>
        </div>
      </section>

      <section id="tab_incidencias" class="tab-content space-y-6">
        <h2 class="text-xl font-semibold text-slate-200 border-l-4 border-amber-500 pl-2">Registro de Incidencias en Turno</h2>
        
        <div class="bg-slate-900/60 p-4 rounded-lg border border-slate-700 grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Hora Parada</label>
            <input type="time" id="inc_h_parada" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Hora Arranque</label>
            <input type="time" id="inc_h_arranque" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Activo Afectado</label>
            <select id="inc_activo" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white"></select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Tarea / Avería</label>
            <select id="inc_tarea" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white"></select>
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-medium text-slate-400 mb-1">Observaciones Específicas</label>
            <input type="text" id="inc_obs" placeholder="Detalles de la avería..." class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white">
          </div>
          <div class="md:col-span-3 text-right">
            <button type="button" onclick="agregarIncidenciaLista()" class="bg-amber-600 hover:bg-amber-500 text-white font-medium py-2 px-4 rounded transition-colors cursor-pointer">+ Añadir a la Lista</button>
          </div>
        </div>

        <div class="overflow-x-auto border border-slate-700 rounded-lg">
          <table class="w-full text-sm text-left text-slate-300">
            <thead class="text-xs uppercase bg-slate-900 text-slate-400 border-b border-slate-700">
              <tr>
                <th class="py-3 px-4">Hora</th>
                <th class="py-3 px-4">Activo</th>
                <th class="py-3 px-4">Tarea</th>
                <th class="py-3 px-4">Obs</th>
                <th class="py-3 px-4 text-center">Acción</th>
              </tr>
            </thead>
            <tbody id="tabla_incidencias_cuerpo">
              <tr>
                <td colspan="5" class="py-4 text-center text-slate-500 italic">No hay incidencias agregadas en este turno.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section id="tab_recambios" class="tab-content space-y-6">
        <h2 class="text-xl font-semibold text-slate-200 border-l-4 border-emerald-500 pl-2">Sustitución de Recambios</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Seleccionar Recambio (Col. E)</label>
            <select id="rec_item" class="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-white focus:border-emerald-500">
              <option value="">Cargando recambios...</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Cantidad Utilizada</label>
            <input type="number" id="rec_cantidad" placeholder="0" class="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-white focus:border-emerald-500">
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-slate-300 mb-2">Detalles Adicionales de Ubicación / Proveedor</label>
            <input type="text" id="rec_detalles" placeholder="Ej: Posición 3, Proveedor Norte" class="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-white focus:border-emerald-500">
          </div>
        </div>
      </section>

      <section id="tab_explosiones" class="tab-content space-y-6">
        <h2 class="text-xl font-semibold text-slate-200 border-l-4 border-red-500 pl-2">Control de Explosiones e Incidentes Críticos</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Material Introducido (Col. L)</label>
            <select id="exp_material" class="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-white focus:border-red-500">
              <option value="">Cargando materiales...</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Tipo de Explosión (Col. J)</label>
            <select id="exp_tipo" class="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-white focus:border-red-500">
              <option value="">Cargando tipos de evento...</option>
            </select>
          </div>
          
          <div class="md:col-span-2 grid grid-cols-3 gap-4 bg-slate-900/40 p-4 rounded-lg border border-slate-700">
            <label class="flex items-center space-x-3 cursor-pointer">
              <input type="checkbox" id="exp_chk_estallido" class="w-5 h-5 accent-red-500 rounded bg-slate-950 border-slate-700">
              <span class="text-sm font-medium text-slate-300">¿Hubo Estallido?</span>
            </label>
            <label class="flex items-center space-x-3 cursor-pointer">
              <input type="checkbox" id="exp_chk_fuego" class="w-5 h-5 accent-red-500 rounded bg-slate-950 border-slate-700">
              <span class="text-sm font-medium text-slate-300">¿Hubo Fuego?</span>
            </label>
            <label class="flex items-center space-x-3 cursor-pointer">
              <input type="checkbox" id="exp_chk_parada" class="w-5 h-5 accent-red-500 rounded bg-slate-950 border-slate-700">
              <span class="text-sm font-medium text-slate-300">¿Causó Parada Crítica?</span>
            </label>
          </div>

          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-slate-300 mb-2">Descripción de Daños Estructurales / Mecánicos</label>
            <input type="text" id="exp_danos" placeholder="Especificar si hubo roturas..." class="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-white focus:border-red-500">
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-slate-300 mb-2">Observaciones Generales de la Explosión</label>
            <textarea id="exp_obs" rows="2" placeholder="Notas operativas..." class="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-white focus:border-red-500"></textarea>
          </div>
        </div>
      </section>

      <div class="mt-8 pt-6 border-t border-slate-700 flex justify-end">
        <button type="button" onclick="enviarReporteEstructurado()" class="bg-gradient-to-r from-cyan-600 to-cyan-500 hover:from-cyan-500 hover:to-cyan-400 text-white font-bold py-3 px-8 rounded-lg shadow-lg tracking-wide transform active:scale-95 transition-all cursor-pointer">
          💾 SUBIR PARTE COMPLETO AL EXCEL
        </button>
      </div>

    </div>
  </div>

  <script>
    // Variables globales para la cola interna de incidencias
    let listaIncidenciasTurno = [];

    // Al cargar la ventana, sincronizamos los datos maestros desde la hoja Config
    window.addEventListener("DOMContentLoaded", function() {
      // Establecer fecha de hoy por defecto en el control común
      document.getElementById('comun_fecha').valueAsDate = new Date();
      
      // Llamada segura a la base de datos de Google Sheets
      if (typeof google !== "undefined" && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(inicializarDesplegablesInterfaz)
          .withFailureHandler(function(err) {
             console.error("Error cargando configuración inicial:", err);
          })
          .obtenerConfigInicial();
      }
    });

    /**
     * Mapea y rellena los 4 nuevos desplegables solicitados + activos y tareas.
     */
    function inicializarDesplegablesInterfaz(config) {
      // 1. Operadores SERAM (Columna M)
      const selOpSeram = document.getElementById("prod_op_seram");
      rellenarSelector(selOpSeram, config.operadoresSeram, "Seleccione Operador SERAM");

      // 2. Recambios (Columna E)
      const selRecambio = document.getElementById("rec_item");
      rellenarSelector(selRecambio, config.recambios, "Seleccione Elemento de Recambio");

      // 3. Material Introducido (Columna L)
      const selMaterial = document.getElementById("exp_material");
      rellenarSelector(selMaterial, config.materiales, "Seleccione Material");

      // 4. Tipo de Explosión (Columna J)
      const selTipoExp = document.getElementById("exp_tipo");
      rellenarSelector(selTipoExp, config.tiposExplosion, "Seleccione Tipo de Magnitud");

      // Adicionales preexistentes (Activos y Tareas)
      rellenarSelector(document.getElementById("inc_activo"), config.activos, null);
      rellenarSelector(document.getElementById("inc_tarea"), config.tareas, null);
    }

    function rellenarSelector(elemento, arrayDatos, textoDefecto) {
      if (!elemento) return;
      elemento.innerHTML = "";
      
      if (textoDefecto) {
        let opt = document.createElement("option");
        opt.value = "";
        opt.textContent = textoDefecto;
        elemento.appendChild(opt);
      }
      
      if (arrayDatos && arrayDatos.length > 0) {
        arrayDatos.forEach(function(item) {
          let opt = document.createElement("option");
          opt.value = item;
          opt.textContent = item;
          elemento.appendChild(opt);
        });
      } else if (!textoDefecto) {
        let opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "Sin datos disponibles";
        elemento.appendChild(opt);
      }
    }

    /**
     * Alternar visibilidad de pestañas sin borrar los datos del DOM.
     */
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');

      // Actualizar estilos estéticos de la navegación
      const botones = ['btn_tab_produccion', 'btn_tab_incidencias', 'btn_tab_recambios', 'btn_tab_explosiones'];
      botones.forEach(btn => {
        const el = document.getElementById(btn);
        if (btn === 'btn_' + tabId) {
          el.classList.remove('border-transparent', 'text-slate-400');
          el.classList.add('border-cyan-500', 'text-cyan-400');
        } else {
          el.classList.remove('border-cyan-500', 'text-cyan-400');
          el.classList.add('border-transparent', 'text-slate-400');
        }
      });
    }

    /**
     * Agrega una incidencia a la tabla en memoria
     */
    function agregarIncidenciaLista() {
      const hParada = document.getElementById("inc_h_parada").value;
      const hArranque = document.getElementById("inc_h_arranque").value;
      const activo = document.getElementById("inc_activo").value;
      const tarea = document.getElementById("inc_tarea").value;
      const obs = document.getElementById("inc_obs").value;

      if (!hParada || !hArranque || !activo || !tarea) {
        Swal.fire("Atención", "Completa la hora de parada, arranque, activo y tarea antes de añadir.", "warning");
        return;
      }

      listaIncidenciasTurno.push({ p: hParada, a: hArranque, ac: activo, t: tarea, o: obs });
      
      // Limpiar campos internos
      document.getElementById("inc_h_parada").value = "";
      document.getElementById("inc_h_arranque").value = "";
      document.getElementById("inc_obs").value = "";
      
      renderizarTablaIncidencias();
    }

    function eliminarIncidenciaMemoria(index) {
      listaIncidenciasTurno.splice(index, 1);
      renderizarTablaIncidencias();
    }

    function renderizarTablaIncidencias() {
      const tbody = document.getElementById("tabla_incidencias_cuerpo");
      tbody.innerHTML = "";

      if (listaIncidenciasTurno.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-slate-500 italic">No hay incidencias agregadas en este turno.</td></tr>`;
        return;
      }

      listaIncidenciasTurno.forEach((inc, index) => {
        let fila = document.createElement("tr");
        fila.className = "border-b border-slate-700/50 hover:bg-slate-900/40";
        fila.innerHTML = `
          <td class="py-3 px-4 text-cyan-400 font-mono">${inc.p} - ${inc.a}</td>
          <td class="py-3 px-4 font-medium text-slate-200">${inc.ac}</td>
          <td class="py-3 px-4">${inc.t}</td>
          <td class="py-3 px-4 max-w-xs truncate text-slate-400" title="${inc.o}">${inc.o || '-'}</td>
          <td class="py-3 px-4 text-center">
            <button onclick="eliminarIncidenciaMemoria(${index})" class="text-red-400 hover:text-red-300 font-semibold px-2 py-1 cursor-pointer">Eliminar</button>
          </td>
        `;
        tbody.appendChild(fila);
      });
    }

    /**
     * Recopila la información distribuida en todos los formularios y la envía al servidor.
     */
    function enviarReporteEstructurado() {
      const fecha = document.getElementById("comun_fecha").value;
      const turno = document.getElementById("comun_turno").value;
      const operario = document.getElementById("comun_operario").value;
      const lote = document.getElementById("comun_lote").value;

      if (!fecha || !operario) {
        Swal.fire("Faltan Datos Generales", "La Fecha y el Nombre del Operario son obligatorios para guardar el registro.", "error");
        return;
      }

      // Estructuración limpia del payload global
      const payload = {
        accion: "submitAll",
        fecha: fecha,
        turno: turno,
        operario: operario,
        lote: lote,
        parte: null,
        incidencias: listaIncidenciasTurno,
        recambios: [],
        explosiones: null
      };

      // Si se llenó información del Parte de Trabajo
      const nPulpadas = document.getElementById("prod_n_pulpadas").value;
      if (nPulpadas) {
        payload.parte = {
          h_mol_fin: document.getElementById("prod_h_mol_fin").value,
          h_prod_fin: document.getElementById("prod_h_prod_fin").value,
          op_seram: document.getElementById("prod_op_seram").value,
          n_pulpadas: parseInt(nPulpadas, 10)
        };
      }

      // Si se llenó información de Recambios
      const recItem = document.getElementById("rec_item").value;
      const recCant = document.getElementById("rec_cantidad").value;
      if (recItem && recCant) {
        payload.recambios.push({
          item: recItem,
          cant: parseInt(recCant, 10),
          detalles: document.getElementById("rec_detalles").value
        });
      }

      // Si se llenó información de Explosiones
      const expMat = document.getElementById("exp_material").value;
      if (expMat) {
        payload.explosiones = {
          material: expMat,
          tipoExp: document.getElementById("exp_tipo").value,
          estallido: document.getElementById("exp_chk_estallido").checked ? "SÍ" : "NO",
          fuego: document.getElementById("exp_chk_fuego").checked ? "SÍ" : "NO",
          parada: document.getElementById("exp_chk_parada").checked ? "SÍ" : "NO",
          danos: document.getElementById("exp_danos").value,
          obs: document.getElementById("exp_obs").value
        };
      }

      Swal.fire({
        title: 'Procesando envío...',
        text: 'Escribiendo registros de manera coordinada en las hojas correspondientes.',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      // Envío mediante el canal seguro de Apps Script HTML Service
      if (typeof google !== "undefined" && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(response) {
            Swal.fire({
              icon: 'success',
              title: '¡Operación Exitosa!',
              text: 'Todos los datos se grabaron de manera persistente en el archivo central de Excel.',
              confirmButtonColor: '#0e7490'
            }).then(() => {
              // Limpieza opcional tras subida
              listaIncidenciasTurno = [];
              renderizarTablaIncidencias();
              document.getElementById("prod_n_pulpadas").value = "";
              document.getElementById("rec_cantidad").value = "";
              document.getElementById("rec_detalles").value = "";
              document.getElementById("exp_danos").value = "";
              document.getElementById("exp_obs").value = "";
            });
          })
          .withFailureHandler(function(err) {
            Swal.fire("Error de red", "Hubo un inconveniente al comunicarse con el servidor: " + err, "error");
          })
          .doPost({ postData: { contents: JSON.stringify(payload) } });
      } else {
        Swal.fire("Entorno simulado", "No se detectó el motor de Google Apps Script. Payload estructurado correctamente en consola.", "info");
        console.log("Payload:", payload);
      }
    }
  </script>
</body>
</html>
